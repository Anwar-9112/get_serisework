<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Social links profile</title>

    <link rel="stylesheet" href="https://fonts.google.com/specimen/Inter" />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <div class="allBody">
      <img class="img1" src="./assets/images/avatar-jessica.jpeg" alt="" />
      <h1 style="color: hsl(0, 0%, 100%); margin-left: 32%">Jessica Randall</h1>
      <h3 style="color: hsl(75, 94%, 57%); margin-left: 32%">
        London, United Kingdom
      </h3>
      <p>"Front-end developer and avid reader."</p>

      <div class="github"><p>GitHub</p></div>
      <div class="github1"><p>Frontend Mentor</p></div>
      <div class="github2"><p>LinkedIn</p></div>
      <div class="github3"><p>Twitter</p></div>
      <div class="github4"><p>Instagram</p></div>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
